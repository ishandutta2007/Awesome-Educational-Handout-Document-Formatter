<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs (Pure SMIL Animations - Safe for GitHub) -->
  <circle cx="200" cy="90" r="180" fill="url(#radialGlow1)">
    <animate attributeName="r" values="160;220;160" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cx" values="190;230;190" dur="9s" repeatCount="indefinite" />
  </circle>

  <circle cx="1020" cy="310" r="200" fill="url(#radialGlow2)">
    <animate attributeName="r" values="180;240;180" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="320;290;320" dur="10s" repeatCount="indefinite" />
  </circle>

  <circle cx="600" cy="210" r="280" fill="url(#radialGlow3)" />

  <!-- Animated Cyber Dashboard Flow Accents (Side flows that do not cover text) -->
  <g opacity="0.4">
    <path d="M 60,320 Q 160,260 260,320" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M 940,90 Q 1040,150 1140,90" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite" />
    </path>
    <circle cx="60" cy="320" r="4" fill="#60a5fa" />
    <circle cx="260" cy="320" r="4" fill="#60a5fa" />
    <circle cx="940" cy="90" r="4" fill="#c084fc" />
    <circle cx="1140" cy="90" r="4" fill="#c084fc" />
  </g>

  <!-- Outer Rounded Border -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Main Foreground Content Area -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Top Badge / Header Tag -->
    <g transform="translate(600, 68)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="-118" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-106" y="5" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Educational Handout &amp; Document Formatter
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" text-anchor="middle" font-size="16" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Worksheet Design Studios • Programmatic Typesetting • Modern Desktop Publishing • Markdown-to-PDF Pipelines
    </text>

    <!-- Tagline description -->
    <text x="600" y="222" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">
      A comprehensive guide to SaaS platforms &amp; open-source repositories for educators, researchers &amp; developers
    </text>

    <!-- Feature Cards / Interactive Visual Pills (With pure SMIL subtle bobbing) -->
    <g transform="translate(135, 268)">
      
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4s" repeatCount="indefinite" />
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <!-- Lightning icon in native SVG paths for cross-platform rendering -->
        <path d="M 27 12 L 18 25 L 24 25 L 21 36 L 31 23 L 25 23 Z" fill="#38bdf8" />
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Typst &amp; LaTeX</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Code-first Typesetting</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <animateTransform attributeName="transform" type="translate" values="240,0; 240,-4; 240,0" dur="4.6s" repeatCount="indefinite" />
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <!-- Document icon in native SVG paths -->
        <path d="M 19 14 L 27 14 L 31 18 L 31 34 L 19 34 Z M 21 16 L 21 32 L 29 32 L 29 20 L 25 20 L 25 16 Z" fill="#a78bfa" />
        <path d="M 23 24 L 27 24 M 23 27 L 27 27" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" />
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Pandoc &amp; Quarto</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Multi-format Export</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <animateTransform attributeName="transform" type="translate" values="480,0; 480,-4; 480,0" dur="4.2s" repeatCount="indefinite" />
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <!-- Palette / Design icon in native SVG paths -->
        <circle cx="24" cy="22" r="8" fill="none" stroke="#f472b6" stroke-width="2" />
        <circle cx="22" cy="20" r="1.5" fill="#f472b6" />
        <circle cx="26" cy="21" r="1.5" fill="#f472b6" />
        <path d="M 28 27 L 31 33" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Penpot &amp; Canvas</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Visual Worksheet Layouts</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(720, 0)">
        <animateTransform attributeName="transform" type="translate" values="720,0; 720,-4; 720,0" dur="5s" repeatCount="indefinite" />
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <!-- Workspace / Team icon in native SVG paths -->
        <circle cx="22" cy="21" r="3" fill="#34d399" />
        <circle cx="28" cy="21" r="3" fill="#34d399" />
        <path d="M 18 31 C 18 27 26 27 26 31 Z M 24 31 C 24 27 32 27 32 31 Z" fill="#34d399" />
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">AppFlowy &amp; AFFiNE</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Self-hosted Workspaces</text>
      </g>

    </g>

    <!-- Footer Stats / Meta Line -->
    <g transform="translate(600, 368)">
      <text text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
        400,000+ COMBINED STARS &nbsp;•&nbsp; K-12 &amp; HIGHER ED READY &nbsp;•&nbsp; OPEN-SOURCE &amp; SAAS
      </text>
    </g>

  </g>
</svg>