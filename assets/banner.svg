<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="accentGlow2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      /* Subtle pulse & drift animations in the background */
      @keyframes float1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-25px, 25px) scale(1.05); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pillBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .floating-orb1 { animation: float1 12s ease-in-out infinite; }
      .floating-orb2 { animation: float2 14s ease-in-out infinite; }
      .pulse-ring { animation: pulseGlow 4s ease-in-out infinite; }
      .moving-line { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
      .pill-hover1 { animation: pillBob 4s ease-in-out infinite; }
      .pill-hover2 { animation: pillBob 4.5s ease-in-out 1s infinite; }
      .pill-hover3 { animation: pillBob 5s ease-in-out 2s infinite; }
      .pill-hover4 { animation: pillBob 4.2s ease-in-out 1.5s infinite; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Animated Glowing Orbs in Background (Non-obstructive) -->
  <g opacity="0.8">
    <circle class="floating-orb1" cx="200" cy="90" r="140" fill="url(#accentGlow1)" />
    <circle class="floating-orb2" cx="1020" cy="310" r="160" fill="url(#accentGlow2)" />
  </g>

  <!-- Subtle Dynamic Tech Graphic Accents (Side flows, keeps text clear) -->
  <g opacity="0.35">
    <path class="moving-line" d="M 60,320 C 140,280 180,360 260,320" fill="none" stroke="#60a5fa" stroke-width="2" />
    <path class="moving-line" d="M 940,90 C 1020,130 1060,50 1140,90" fill="none" stroke="#c084fc" stroke-width="2" />
    <circle cx="60" cy="320" r="4" fill="#60a5fa" />
    <circle cx="260" cy="320" r="4" fill="#60a5fa" />
    <circle cx="940" cy="90" r="4" fill="#c084fc" />
    <circle cx="1140" cy="90" r="4" fill="#c084fc" />
  </g>

  <!-- Decorative Outer Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Content Container (Centered & High-contrast Foreground) -->
  <g id="foreground-content" class="font-sans">
    
    <!-- Top Meta Tag / Pill -->
    <g transform="translate(600, 68)">
      <rect x="-145" y="-16" width="290" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <circle cx="-125" cy="0" r="4" fill="#38bdf8" class="pulse-ring" />
      <text x="-112" y="5" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-size="40" font-weight="800" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="-0.5">
      Awesome Educational Handout &amp; Document Formatter
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="190" text-anchor="middle" font-size="17" font-weight="500" fill="#e2e8f0" opacity="0.95" letter-spacing="0.2">
      Worksheet Design Studios • Programmatic Typesetting • Modern Desktop Publishing • Markdown-to-PDF Pipelines
    </text>

    <!-- Secondary descriptive line -->
    <text x="600" y="222" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">
      A comprehensive guide to SaaS platforms &amp; open-source repositories for educators, researchers &amp; developers
    </text>

    <!-- Interactive / Dynamic Feature Badges (Pills) -->
    <g id="pills" transform="translate(135, 268)">
      
      <!-- Pill 1: Typst & LaTeX -->
      <g class="pill-hover1" transform="translate(0, 0)">
        <rect width="215" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="2" y="2" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="23" y="27" font-size="19" text-anchor="middle">⚡</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Typst &amp; LaTeX</text>
        <text x="56" y="37" font-size="11" font-weight="400" fill="#94a3b8">Code-first Typesetting</text>
      </g>

      <!-- Pill 2: Markdown & Quarto -->
      <g class="pill-hover2" transform="translate(240, 0)">
        <rect width="215" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="2" y="2" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="23" y="27" font-size="19" text-anchor="middle">📑</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Pandoc &amp; Quarto</text>
        <text x="56" y="37" font-size="11" font-weight="400" fill="#94a3b8">Multi-format Export</text>
      </g>

      <!-- Pill 3: Visual & Worksheets -->
      <g class="pill-hover3" transform="translate(480, 0)">
        <rect width="215" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="2" y="2" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="23" y="27" font-size="19" text-anchor="middle">🎨</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Penpot &amp; Canvas</text>
        <text x="56" y="37" font-size="11" font-weight="400" fill="#94a3b8">Visual Worksheet Layouts</text>
      </g>

      <!-- Pill 4: Collaborative Suites -->
      <g class="pill-hover4" transform="translate(720, 0)">
        <rect width="215" height="46" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="2" y="2" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="23" y="27" font-size="19" text-anchor="middle">🤝</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">AppFlowy &amp; AFFiNE</text>
        <text x="56" y="37" font-size="11" font-weight="400" fill="#94a3b8">Self-hosted Workspaces</text>
      </g>

    </g>

    <!-- Bottom Metrics / Summary Footer Line -->
    <g transform="translate(600, 365)">
      <text text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
        ⭐ 400,000+ COMBINED COMMUNITY STARS &nbsp;•&nbsp; 🎓 K-12 &amp; HIGHER ED READY &nbsp;•&nbsp; 🛠️ OPEN-SOURCE &amp; SAAS
      </text>
    </g>

  </g>
</svg>