<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Orbs -->
    <radialGradient id="radialGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.2" />
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.25" />
    </pattern>

    <style>
      .font-main {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      @keyframes pulseSlow {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }

      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .pulse-bg-1 {
        transform-origin: 180px 100px;
        animation: pulseSlow 8s ease-in-out infinite;
      }

      .pulse-bg-2 {
        transform-origin: 1020px 310px;
        animation: pulseSlow 10s ease-in-out 1s infinite;
      }

      .flow-card-1 { animation: floatSoft 4.5s ease-in-out infinite; }
      .flow-card-2 { animation: floatSoft 5.0s ease-in-out 1s infinite; }
      .flow-card-3 { animation: floatSoft 4.8s ease-in-out 2s infinite; }
      .flow-card-4 { animation: floatSoft 5.2s ease-in-out 1.5s infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Animated Ambient Lights -->
  <circle class="pulse-bg-1" cx="180" cy="100" r="220" fill="url(#radialGlow1)" />
  <circle class="pulse-bg-2" cx="1020" cy="310" r="240" fill="url(#radialGlow2)" />
  <circle cx="600" cy="210" r="280" fill="url(#radialGlow3)" />

  <!-- Geometric Tech Connection Accents -->
  <g opacity="0.35">
    <path d="M 60,320 Q 160,260 260,320" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6,6" />
    <path d="M 940,90 Q 1040,150 1140,90" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="60" cy="320" r="4" fill="#60a5fa" />
    <circle cx="260" cy="320" r="4" fill="#60a5fa" />
    <circle cx="940" cy="90" r="4" fill="#c084fc" />
    <circle cx="1140" cy="90" r="4" fill="#c084fc" />
  </g>

  <!-- Outer Rounded Border -->
  <rect x="2" y="2" width="1196" height="416" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Foreground Content -->
  <g class="font-main">

    <!-- Top Badge / Header Tag -->
    <g transform="translate(600, 68)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="-118" cy="0" r="4" fill="#38bdf8" />
      <text x="-106" y="5" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Educational Handout &amp; Document Formatter
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" text-anchor="middle" font-size="16" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Worksheet Design Studios • Programmatic Typesetting • Modern Desktop Publishing • Markdown-to-PDF Pipelines
    </text>

    <!-- Tagline description -->
    <text x="600" y="222" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">
      A comprehensive guide to SaaS platforms &amp; open-source repositories for educators, researchers &amp; developers
    </text>

    <!-- Feature Cards / Interactive Visual Pills -->
    <g transform="translate(135, 268)">
      <!-- Card 1 -->
      <g class="flow-card-1" transform="translate(0, 0)">
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="24" y="29" font-size="20" text-anchor="middle">⚡</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Typst &amp; LaTeX</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Code-first Typesetting</text>
      </g>

      <!-- Card 2 -->
      <g class="flow-card-2" transform="translate(240, 0)">
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="24" y="29" font-size="20" text-anchor="middle">📑</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Pandoc &amp; Quarto</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Multi-format Export</text>
      </g>

      <!-- Card 3 -->
      <g class="flow-card-3" transform="translate(480, 0)">
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="24" y="29" font-size="20" text-anchor="middle">🎨</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">Penpot &amp; Canvas</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Visual Worksheet Layouts</text>
      </g>

      <!-- Card 4 -->
      <g class="flow-card-4" transform="translate(720, 0)">
        <rect width="215" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <rect x="3" y="3" width="42" height="42" rx="8" fill="#0f172a" />
        <text x="24" y="29" font-size="20" text-anchor="middle">🤝</text>
        <text x="56" y="22" font-size="13" font-weight="700" fill="#f8fafc">AppFlowy &amp; AFFiNE</text>
        <text x="56" y="38" font-size="11" font-weight="400" fill="#94a3b8">Self-hosted Workspaces</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <g transform="translate(600, 368)">
      <text text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">
        ⭐ 400,000+ COMBINED STARS &nbsp;•&nbsp; 🎓 K-12 &amp; HIGHER ED READY &nbsp;•&nbsp; 🛠️ OPEN-SOURCE &amp; SAAS
      </text>
    </g>

  </g>
</svg>